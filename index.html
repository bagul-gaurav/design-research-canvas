};

/* Convert a data-URL to a Blob */
function dataUrlToBlob(dataUrl){
  const [head, b64] = dataUrl.split(',');
  const mime = (head.match(/data:([^;]+)/)||[])[1] || 'image/png';
  const bin = atob(b64); const len = bin.length; const arr = new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

document.getElementById('lbDownload').onclick = ()=>{
  if(!lbCurrent) return;
  const a = document.createElement('a');
  a.href = lbCurrent.img;
  const safe = (lbCurrent.title||'image').replace(/[^\w.-]+/g,'_').slice(0,40);
  const ext = ((lbCurrent.img.match(/data:image\/(\w+)/)||[])[1]||'png');
  a.download = `${safe}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
};

document.getElementById('lbCopy').onclick = async ()=>{
  if(!lbCurrent) return;
  const btn = document.getElementById('lbCopy');
  try {
    const blob = dataUrlToBlob(lbCurrent.img);
    // ClipboardItem image copy (PNG widely supported); fall back to copying nothing gracefully
    await navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
    btn.innerHTML = '<span class="ms">check</span> Copied'; btn.classList.add('ok');
    setTimeout(()=>{ btn.innerHTML='<span class="ms">content_copy</span> Copy'; btn.classList.remove('ok'); }, 1600);
  } catch(err) {
    btn.textContent = 'Copy failed'; setTimeout(()=>{ btn.innerHTML='<span class="ms">content_copy</span> Copy'; }, 1600);
  }
};

/* ---------------- View tiers (canvas / grid / feed) ----------------
   Detection keys off pointer capability + width, not width alone — this is
   what fixes the "touch laptop / iPad gets an unusable hover canvas" bug.
     - fine pointer (mouse) + wide   -> canvas (spatial pan/zoom)
     - coarse pointer OR mid width   -> grid (masonry, tap to open)
     - narrow                        -> feed (single column)
   The user can override via the topbar switcher; the override is remembered
   until the viewport crosses into a tier that can't honor it. */
const VIEWS = ['canvas','grid','feed'];
const hasFinePointer = ()=> window.matchMedia('(pointer: fine)').matches;
const hasHover       = ()=> window.matchMedia('(hover: hover)').matches;

function autoView(){
  const w = window.innerWidth;
  if(w < 640) return 'feed';
  // canvas only makes sense with a real pointer AND room to pan
  if(w >= 1024 && hasFinePointer() && hasHover()) return 'canvas';
  return 'grid';
}
function currentView(){ return autoView(); }

function orderFeed(){
  if(document.body.classList.contains('canvas')) return;
  [...cards].sort((a,b)=>b.createdAt-a.createdAt).forEach(c=>{ if(c.el) world.appendChild(c.el); });
}

function applyViewClasses(v){
  const b = document.body;
  b.classList.toggle('canvas', v==='canvas');
  b.classList.toggle('grid',   v==='grid');
  b.classList.toggle('feed',   v==='feed');
  b.classList.toggle('flat',   v!=='canvas');                 // grid+feed share flat base
  b.classList.toggle('narrow', window.innerWidth < 640);      // compact stacked topbar
  b.classList.toggle('has-hover', hasHover());
}

function syncView(){
  const v = currentView();
  const prev = VIEWS.find(x=>document.body.classList.contains(x));
  applyViewClasses(v);
  // measure wrapped topbar so the rail + content never hide beneath it (flat tiers only)
  const topbar = document.querySelector('.topbar');
  const rail = document.querySelector('.tagrail');
  if(v !== 'canvas'){
    requestAnimationFrame(()=>{
      const th = topbar.offsetHeight;
      rail.style.top = th + 'px';
      const pad = th + rail.offsetHeight + 16;
      world.style.paddingTop = pad + 'px';
    });
  } else {
    rail.style.top = ''; world.style.paddingTop = '';
  }
  if(v !== 'canvas' && prev === 'canvas') orderFeed();
  if(v !== prev) drawLinks();
}

// debounce resize a touch so column reflow isn't janky
let viewTimer=null;
window.addEventListener('resize', ()=>{ clearTimeout(viewTimer); viewTimer=setTimeout(syncView, 120); });
window.matchMedia('(pointer: fine)').addEventListener?.('change', syncView);
