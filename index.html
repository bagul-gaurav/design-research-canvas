<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — Design Research Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  .ms {
    font-family: 'Material Symbols Outlined';
    font-weight: 300; font-style: normal;
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    font-size: 18px; line-height: 1; display: inline-block; vertical-align: -4px;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .btn-icon .ms { font-size: 17px; vertical-align: -3.5px; }
  .mini .ms, .pop-x .ms { font-size: 15px; vertical-align: 0; }
  .lb-close .ms { font-size: 20px; vertical-align: 0; }
  .zoom .ms { font-size: 20px; vertical-align: 0; }
  .lb-btn .ms { font-size: 16px; }
  .fab .ms { font-size: 28px; vertical-align: 0; }
  .save-status .ms { font-size: 13px; vertical-align: -2.5px; }
</style>
<style>
  :root {
    /* Linear — midnight command deck */
    --color-onyx: #08090a;
    --color-charcoal: #0f1011;
    --color-obsidian: #161718;
    --color-graphite: #23252a;
    --color-iron: #323334;
    --color-steel: #383b3f;
    --color-slate: #62666d;
    --color-fog: #8a8f98;
    --color-mist: #d0d6e0;
    --color-platinum: #e5e5e6;
    --color-snow: #f7f8f8;
    --color-acid-lime: #e4f222;
    --color-indigo: #5e6ad2;
    --color-emerald: #27a644;
    --color-crimson: #eb5757;
    --color-cyan: #02b8cc;

    --indigo-tint: rgba(94,106,210,0.10);
    --indigo-tint-2: rgba(94,106,210,0.18);

    --font-inter: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    --text-micro: 11px;
    --text-caption: 12px;
    --text-body-sm: 13px;
    --text-body: 14px;
    --text-subheading: 20px;

    --w-light: 300; --w-reg: 400; --w-510: 510; --w-590: 590;

    --radius-cards: 26px;
    --radius-inputs: 14px;
    --radius-buttons: 14px;
    --radius-badges: 9999px;   /* tags now full pills */
    --radius-pills: 9999px;
    --radius-mini: 14px;
    --radius-modal: 30px;
    /* iOS-style squircle corner mask (G2 continuity) for elements that support it */
    --squircle: 42% / 36%;

    --shadow-sm: rgba(0, 0, 0, 0.4) 0px 2px 4px 0px;
    --shadow-inset-border: rgb(35, 37, 42) 0px 0px 0px 1px inset;
    --shadow-input: rgba(0, 0, 0, 0.2) 0px 0px 0px 1px;
    --shadow-stack: rgba(0,0,0,0.01) 0px 5px 2px 0px, rgba(0,0,0,0.04) 0px 3px 2px 0px, rgba(0,0,0,0.07) 0px 1px 1px 0px, rgba(0,0,0,0.08) 0px 0px 1px 0px;
    --shadow-xl: rgba(8, 9, 10, 0.6) 0px 4px 32px 0px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--color-onyx);
    color: var(--color-snow);
    font-family: var(--font-inter);
    font-feature-settings: "cv01" on, "ss03" on;
    -webkit-font-smoothing: antialiased;
    color-scheme: dark;
  }
  ::selection { background: var(--indigo-tint-2); }
  :focus-visible { outline: 2px solid var(--color-indigo); outline-offset: 1px; border-radius: 2px; }

  /* No gradients on surfaces — atmosphere layer retired */
  .atmosphere { display: none; }

  /* ---- Top bar ---- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 56px;
    display: flex; align-items: center; gap: 20px; padding: 0 24px;
    background: var(--color-charcoal);
    border-bottom: 1px solid var(--color-graphite);
  }
  .brand { font-size: 15px; font-weight: var(--w-510); color: var(--color-snow); display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-indigo); }
  .brand .sub { font-size: var(--text-micro); color: var(--color-fog); font-weight: var(--w-reg); letter-spacing: 0.02em; text-transform: none; }
  .save-status { font-size: var(--text-micro); font-family: var(--font-mono); letter-spacing: -0.015em; color: var(--color-slate); white-space: nowrap; transition: color .2s; }
  .save-status.ok { color: var(--color-emerald); }
  .save-status.warn { color: var(--color-crimson); }

  /* ---- Auth gate ---- */
  .auth-gate {
    position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
    background: var(--color-onyx);
  }
  .auth-card {
    width: 340px; max-width: 90vw; padding: 32px 28px;
    background: var(--color-charcoal);
    border-radius: var(--radius-modal);
    box-shadow: var(--shadow-inset-border), var(--shadow-sm); text-align: center;
  }
  .auth-lede { font-size: var(--text-body-sm); color: var(--color-fog); margin-bottom: 18px; line-height: 1.5; }
  .auth-card input {
    width: 100%; background: var(--color-steel); border: 1px solid transparent;
    border-radius: var(--radius-inputs); color: var(--color-snow);
    font-family: var(--font-inter); font-size: var(--text-body); padding: 9px 12px; outline: none; margin-bottom: 10px;
    box-shadow: var(--shadow-input);
  }
  .auth-card input::placeholder { color: var(--color-slate); }
  .auth-card input:focus { box-shadow: 0 0 0 1px var(--color-indigo) inset; }
  .auth-msg { font-size: var(--text-caption); color: var(--color-crimson); min-height: 16px; margin: 2px 0 6px; }

  .search-wrap { flex: 1; max-width: 420px; }
  .search {
    width: 100%; height: 34px; background: var(--color-steel);
    border: none; border-radius: var(--radius-inputs);
    color: var(--color-snow); font-family: var(--font-inter); font-size: var(--text-body);
    padding: 0 12px; outline: none; box-shadow: var(--shadow-input); transition: box-shadow .15s;
  }
  .search::placeholder { color: var(--color-slate); }
  .search:focus { box-shadow: 0 0 0 1px var(--color-indigo) inset; }

  .spacer { flex: 1; }

  /* Ghost nav buttons; .active is the single lime CTA */
  .btn {
    font-family: var(--font-inter); font-size: var(--text-body); font-weight: var(--w-reg);
    background: transparent; color: var(--color-fog);
    border: none; border-radius: var(--radius-buttons);
    padding: 8px 12px; cursor: pointer; transition: color .15s, background .15s, border-color .15s; white-space: nowrap;
  }
  .btn:hover { color: var(--color-snow); }
  .btn.on-mode { color: var(--color-indigo); }
  .btn.active {
    corner-shape: squircle; position: relative; overflow: hidden;
    background:
      radial-gradient(75% 130% at var(--p1x) var(--p1y), #43e97b 12%, transparent 60%),
      radial-gradient(80% 140% at var(--p2x) var(--p2y), #66a6ff 10%, transparent 62%),
      linear-gradient(110deg, #38f9d7, #66a6ff);
    color: #08090a; font-weight: var(--w-510);
    padding: 8px 18px; box-shadow: var(--shadow-stack); border-radius: var(--radius-buttons);
    transition: box-shadow .3s ease;
  }
  .btn.active:hover {
    color: #08090a;
    animation: liquid-flow 2.6s ease-in-out infinite;
    box-shadow: 0 4px 22px -4px rgba(56,249,215,0.55), var(--shadow-stack);
  }
  /* grain lives only in the gradient — CTA + FAB are the gradient surfaces now */
  .btn.active::after, .fab::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 120px 120px; opacity: 0.14; mix-blend-mode: overlay;
  }
  .btn-icon { display: inline-flex; align-items: center; gap: 6px; }
  #signOutBtn { border: 1px solid var(--color-iron); border-radius: var(--radius-pills); padding: 6px 12px; color: var(--color-fog); }
  #signOutBtn:hover { border-color: var(--color-snow); color: var(--color-snow); }

  /* ---- Tag rail ---- */
  .tagrail {
    position: fixed; top: 56px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 8px; padding: 10px 24px;
    background: rgba(8,9,10,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-graphite);
    overflow-x: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 32px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 32px), transparent 100%);
  }
  .tagrail::-webkit-scrollbar { display: none; }
  .tag-chip {
    font-size: var(--text-caption); font-weight: var(--w-reg);
    color: var(--color-fog); background: transparent;
    border: 1px solid var(--color-graphite); border-radius: var(--radius-pills);
    padding: 5px 12px; cursor: pointer; transition: all .15s; white-space: nowrap;
    font-family: var(--font-inter);
  }
  .tag-chip:hover { border-color: var(--color-iron); color: var(--color-snow); }
  .tag-chip.on { color: var(--color-snow); background: var(--color-obsidian); border-color: var(--color-platinum); }
  .tag-chip .cnt { font-family: var(--font-mono); font-size: 10px; color: var(--color-slate); margin-left: 6px; }
  .tag-chip.on .cnt { color: var(--color-fog); }
  .tag-chip.clear-filter { color: var(--color-crimson); border-color: rgba(235,87,87,0.45); border-style: dashed; margin-left: 4px; }
  .tag-chip.clear-filter:hover { background: rgba(235,87,87,0.08); }
  .tag-chip.manage { color: var(--color-fog); border-style: dashed; margin-left: 4px; }
  .tag-chip.manage:hover { border-color: var(--color-iron); color: var(--color-snow); }

  /* --- Status filter chips --- */
  .tag-chip.st-chip { display: inline-flex; align-items: center; gap: 6px; }
  .st-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--color-slate); }
  .st-building .st-dot { background: var(--color-crimson); }
  .st-done .st-dot { background: var(--color-emerald); }
  .tag-chip.st-idea.on { background: rgba(98,102,109,0.18); border-color: var(--color-slate); color: var(--color-snow); }
  .tag-chip.st-building.on { background: rgba(235,87,87,0.15); border-color: var(--color-crimson); color: #ff9a9a; }
  .tag-chip.st-done.on { background: rgba(39,166,68,0.15); border-color: var(--color-emerald); color: #84e6a0; }
  .rail-div { flex: none; width: 1px; height: 18px; background: var(--color-graphite); margin: 0 4px; }

  /* --- Status-driven card weight (rest state) --- */
  .card[data-status="done"] { opacity: 0.62; }
  .card[data-status="done"]:hover { opacity: 1; }
  .card[data-status="building"] { box-shadow: rgba(235,87,87,0.22) 0px 0px 0px 1px inset, var(--shadow-sm); }
  .card.has-grad[data-status="building"]::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: rgba(235,87,87,0.18) 0px 0px 0px 1.5px inset;
  }

  /* ---- Canvas ---- */
  #viewport { position: fixed; inset: 0; z-index: 10; cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  .grid {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* ---- Cards ---- */
  .card {
    position: absolute; width: 252px; z-index: 2;
    background: var(--color-charcoal);
    border: none; border-radius: var(--radius-cards);
    corner-shape: squircle;
    box-shadow: var(--shadow-inset-border), var(--shadow-sm); overflow: hidden;
    cursor: grab; transition: box-shadow .2s, transform .15s;
    animation: cardIn .35s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes cardIn { from{opacity:0; transform:translateY(8px) scale(.98)} to{opacity:1; transform:none} }
  .card:hover { box-shadow: rgb(50,51,52) 0px 0px 0px 1px inset, var(--shadow-sm); }
  .card.dragging { cursor: grabbing; z-index: 999 !important; box-shadow: rgb(50,51,52) 0px 0px 0px 1px inset, var(--shadow-xl); }
  .card.resurfaced { box-shadow: var(--color-indigo) 0px 0px 0px 1px inset, var(--shadow-xl); }
  .card.popover-open { overflow: visible; z-index: 1001; }

  .card img { width: 100%; display: block; max-height: 200px; object-fit: cover; background: var(--color-obsidian); }
  .card .embed, .card > a:first-child img, .card > img:first-child { border-top-left-radius: var(--radius-cards); border-top-right-radius: var(--radius-cards); }
  .card .body { padding: 14px 16px 16px; }
  .card .ttl { font-size: var(--text-body); font-weight: var(--w-510); line-height: 1.35; color: var(--color-snow); padding-right: 56px; }
  .card .note { font-size: var(--text-caption); line-height: 1.5; color: var(--color-fog); margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .card .reason {
    font-size: var(--text-caption); line-height: 1.5; color: var(--color-mist);
    margin-top: 10px; padding: 9px 11px; background: var(--color-obsidian);
    border-radius: var(--radius-inputs); box-shadow: var(--shadow-inset-border); word-break: break-word;
  }
  .card .reason-mark { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-indigo); display: block; margin-bottom: 3px; }
  .card .link { font-size: var(--text-caption); color: var(--color-indigo); text-decoration: none; word-break: break-all; display: block; margin-top: 4px; font-weight: var(--w-reg); }
  .card .link:hover { color: #7b86e2; text-decoration: underline; }
  .card .descr { font-size: var(--text-caption); line-height: 1.5; color: var(--color-fog); margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .ocr-flag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-cyan); margin-top: 6px; }
  .card .palette { display: flex; gap: 4px; margin-top: 8px; }
  .card .palette .swatch {
    width: 30px; height: 22px; border-radius: 8px; box-shadow: var(--shadow-inset-border); cursor: pointer;
    transition: transform .12s; border: none;
  }
  .card .palette .swatch:hover { transform: scale(1.12); }
  .card .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; align-items: center; }
  .card .ct {
    font-size: var(--text-micro); font-weight: var(--w-510);
    color: var(--color-mist); background: var(--color-obsidian);
    border: 1px solid var(--color-graphite);
    border-radius: var(--radius-pills); padding: 3px 10px;
  }
  .card .age { font-family: var(--font-mono); font-size: 10px; letter-spacing: -0.015em; color: var(--color-fog); margin-left: auto; }
  .card .embed { aspect-ratio: 16/9; width: 100%; border: 0; display: block; background: var(--color-obsidian); }

  .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .card:hover .card-actions { opacity: 1; }
  .mini {
    width: 28px; height: 28px; border-radius: var(--radius-mini);
    background: var(--color-obsidian); border: 1px solid var(--color-graphite);
    color: var(--color-fog); cursor: pointer;
    display: grid; place-items: center; line-height: 1; box-shadow: var(--shadow-sm); transition: all .15s;
  }
  .mini:hover { color: var(--color-snow); border-color: var(--color-iron); }

  /* ---- Incomplete cards (no tags or no "why") — crimson focused edge ---- */
  .card.incomplete { box-shadow: rgba(235,87,87,0.55) 0px 0px 0px 1px inset, var(--shadow-sm); }
  .card.incomplete:hover { box-shadow: rgba(235,87,87,0.8) 0px 0px 0px 1px inset, var(--shadow-sm); }

  /* ---- Implementation status — dot pill ---- */
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-inter); font-size: var(--text-micro); font-weight: var(--w-510);
    border-radius: var(--radius-pills); padding: 3px 10px 3px 8px; cursor: pointer;
    background: transparent; border: 1px solid var(--color-graphite); color: var(--color-mist);
    transition: border-color .15s; user-select: none;
  }
  .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--color-slate); flex: none; }
  .status-badge.building::before { background: var(--color-crimson); }
  .status-badge.done::before { background: var(--color-emerald); }
  .status-badge:hover { border-color: var(--color-iron); }

  /* ---- Connections layer ---- */
  #links { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: 0; }
  /* line color/width come from per-line gradient attributes set in drawLinks() */

  /* ---- Hint ---- */
  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 45;
    font-size: var(--text-caption); color: var(--color-fog);
    background: var(--color-charcoal); border-radius: var(--radius-pills);
    box-shadow: var(--shadow-inset-border), var(--shadow-sm);
    padding: 9px 18px; display: flex; gap: 14px; align-items: center;
  }
  .hint kbd {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: -0.015em;
    background: var(--color-steel); border-radius: 4px; padding: 1px 6px; color: var(--color-mist);
    box-shadow: var(--shadow-input);
  }

  /* ---- Resurface panel ---- */
  .panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 320px; z-index: 60;
    background: var(--color-charcoal); border-left: 1px solid var(--color-graphite);
    box-shadow: var(--shadow-xl);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
    padding: 24px; overflow-y: auto;
  }
  .panel.open { transform: none; }
  .panel h2 { font-size: var(--text-subheading); font-weight: var(--w-510); letter-spacing: -0.2px; color: var(--color-snow); }
  .panel p.lede { font-size: var(--text-caption); color: var(--color-fog); margin-top: 6px; line-height: 1.5; }
  .rsf-item {
    margin-top: 12px; padding: 12px 14px; background: var(--color-obsidian);
    box-shadow: var(--shadow-inset-border);
    border: none; border-radius: var(--radius-inputs); cursor: pointer; transition: box-shadow .2s;
  }
  .rsf-item:hover { box-shadow: rgb(50,51,52) 0px 0px 0px 1px inset; }
  .rsf-item .t { font-size: var(--text-body-sm); font-weight: var(--w-510); color: var(--color-snow); }
  .rsf-item .a { font-family: var(--font-mono); font-size: 10px; color: var(--color-slate); margin-top: 4px; }
  .panel-close { position: absolute; top: 18px; right: 18px; }

  /* manage-tags rows */
  .mtag-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 8px; padding: 9px 12px; background: var(--color-obsidian);
    box-shadow: var(--shadow-inset-border); border: none; border-radius: var(--radius-inputs);
  }
  .mtag-row .name { font-size: var(--text-body-sm); font-weight: var(--w-reg); color: var(--color-snow); }
  .mtag-row .name .c { font-family: var(--font-mono); color: var(--color-slate); margin-left: 6px; font-size: 10px; }
  .mtag-del {
    font-family: var(--font-inter); font-size: var(--text-micro); color: var(--color-crimson);
    background: transparent; border: 1px solid rgba(235,87,87,0.45); border-radius: var(--radius-buttons);
    padding: 3px 10px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .mtag-del:hover { background: rgba(235,87,87,0.1); border-color: var(--color-crimson); }

  /* ---- Add modal ---- */
  .modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(8,9,10,0.7); backdrop-filter: blur(4px); display: none; place-items: center; }
  .modal-bg.open { display: grid; }
  .modal {
    width: 440px; max-width: 92vw; background: var(--color-charcoal);
    border: none; border-radius: var(--radius-modal); corner-shape: squircle;
    padding: 24px; box-shadow: var(--shadow-inset-border), var(--shadow-xl); animation: cardIn .3s both;
  }
  .modal h3 { font-size: var(--text-subheading); font-weight: var(--w-510); letter-spacing: -0.2px; margin-bottom: 12px; color: var(--color-snow); }
  .modal label { font-family: var(--font-mono); font-size: 10px; color: var(--color-fog); display: block; margin: 14px 0 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .modal input, .modal textarea {
    width: 100%; background: var(--color-steel); border: 1px solid transparent;
    border-radius: var(--radius-inputs); color: var(--color-snow);
    font-family: var(--font-inter); font-size: var(--text-body); padding: 9px 12px; outline: none;
    box-shadow: var(--shadow-input);
  }
  .modal input::placeholder, .modal textarea::placeholder { color: var(--color-slate); }
  .modal input:focus, .modal textarea:focus { box-shadow: 0 0 0 1px var(--color-indigo) inset; }
  .modal textarea { resize: vertical; min-height: 56px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; align-items: center; }
  .seg { display: flex; gap: 6px; margin-bottom: 8px; }
  .seg button {
    flex: 1; font-family: var(--font-inter); font-size: var(--text-caption); font-weight: var(--w-reg);
    background: transparent; color: var(--color-fog);
    border: 1px solid var(--color-graphite); border-radius: var(--radius-buttons);
    padding: 7px; cursor: pointer; transition: all .15s;
  }
  .seg button.on { background: var(--color-obsidian); color: var(--color-snow); border-color: var(--color-platinum); }

  /* ---- Tag picker ---- */
  .tagpicker { display: flex; flex-wrap: wrap; gap: 10px 9px; align-items: center; }
  .tp-tag {
    font-size: var(--text-caption); font-weight: var(--w-reg); font-family: var(--font-inter);
    color: var(--color-fog); background: transparent;
    border: 1px solid var(--color-graphite); border-radius: var(--radius-badges);
    padding: 5px 13px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tp-tag:hover { color: var(--color-snow); border-color: var(--color-iron); }
  .tp-tag.on { color: var(--color-snow); background: var(--color-obsidian); border-color: var(--color-platinum); }
  .tp-new {
    font-size: var(--text-caption); background: var(--color-steel);
    border: 1px dashed var(--color-iron); border-radius: var(--radius-badges);
    color: var(--color-snow); padding: 5px 13px; width: 140px; outline: none; font-family: var(--font-inter);
  }
  .tp-new::placeholder { color: var(--color-slate); }
  .tp-new:focus { border-color: var(--color-indigo); border-style: solid; }

  /* inline card tag/why popover */
  .card-tagpop {
    position: absolute; z-index: 1000; top: 8px; left: 8px; right: 8px;
    background: var(--color-obsidian);
    border: none; border-radius: var(--radius-modal); padding: 16px;
    box-shadow: var(--shadow-inset-border), var(--shadow-xl);
    animation: cardIn .2s both;
  }
  .card-tagpop .pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .card-tagpop .ttl-pop { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-indigo); }
  .card-tagpop .pop-x {
    width: 24px; height: 24px; border-radius: var(--radius-buttons); border: 1px solid var(--color-graphite);
    background: var(--color-charcoal); color: var(--color-fog); cursor: pointer;
    line-height: 1; display: grid; place-items: center; transition: all .15s;
  }
  .card-tagpop .pop-x:hover { color: var(--color-snow); border-color: var(--color-iron); }
  .card-tagpop .why-field, .card-tagpop .link-field {
    width: 100%; background: var(--color-steel); border: 1px solid transparent;
    border-radius: var(--radius-inputs); color: var(--color-snow); font-family: var(--font-inter);
    font-size: var(--text-caption); padding: 8px 10px; outline: none; margin-bottom: 10px;
    box-shadow: var(--shadow-input);
  }
  .card-tagpop .why-field { resize: none; min-height: 46px; }
  .card-tagpop .why-field:focus, .card-tagpop .link-field:focus { box-shadow: 0 0 0 1px var(--color-indigo) inset; }
  .card-tagpop .why-field::placeholder, .card-tagpop .link-field::placeholder { color: var(--color-slate); }
  .card-tagpop .done {
    margin-top: 10px; width: 100%; font-family: var(--font-inter); font-size: var(--text-body-sm); font-weight: var(--w-510);
    background: transparent; color: var(--color-snow); border: 1px solid var(--color-iron);
    border-radius: var(--radius-buttons); padding: 8px; cursor: pointer; transition: all .15s;
  }
  .card-tagpop .done:hover { border-color: var(--color-platinum); }

  /* ---- Suggested tags — indigo accents ---- */
  .sg-row { display: flex; flex-wrap: wrap; gap: 9px 8px; margin: 4px 0 12px; }
  .sg-tag {
    font-size: var(--text-caption); font-weight: var(--w-reg); font-family: var(--font-inter);
    color: #98a1e8; background: var(--indigo-tint);
    border: 1px dashed rgba(94,106,210,0.5); border-radius: var(--radius-badges);
    padding: 3px 10px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .sg-tag:hover { background: var(--indigo-tint-2); color: var(--color-mist); }
  .sg-tag::before { content: '+ '; }

  /* ---- "Needs context" affordance on incomplete cards ---- */
  .ct.needs {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--color-crimson); background: transparent;
    border: 1px dashed rgba(235,87,87,0.5); cursor: pointer; transition: all .15s;
  }
  .ct.needs::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--color-crimson); }
  .ct.needs:hover { background: rgba(235,87,87,0.08); border-style: solid; }

  /* ---- Empty / no-match state ---- */
  .empty-state {
    position: fixed; inset: 0; z-index: 30; display: none;
    place-items: center; pointer-events: none; text-align: center; padding: 24px;
  }
  .empty-state.show { display: grid; }
  .empty-state .es-inner { pointer-events: auto; max-width: 380px; }
  .empty-state .es-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-indigo); margin-bottom: 10px; }
  .empty-state h2 { font-size: 24px; font-weight: var(--w-light); letter-spacing: -0.264px; color: var(--color-snow); }
  .empty-state p { font-size: var(--text-body); line-height: 1.6; color: var(--color-fog); margin-top: 8px; }
  .empty-state kbd {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: -0.015em;
    background: var(--color-steel); border-radius: 4px; padding: 2px 7px; color: var(--color-mist);
    box-shadow: var(--shadow-input);
  }
  .empty-state .es-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: center; }
  .empty-state .es-btn {
    font-family: var(--font-inter); font-size: var(--text-body-sm); font-weight: var(--w-reg);
    background: transparent; color: var(--color-snow); border: 1px solid var(--color-iron);
    border-radius: var(--radius-buttons); padding: 7px 14px; cursor: pointer; transition: border-color .15s;
  }
  .empty-state .es-btn:hover { border-color: var(--color-platinum); }
  /* (empty-state narrow offset handled by body.flat.narrow rule below) */

  /* ---- Lightbox ---- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,9,10,0.88); backdrop-filter: blur(8px); padding: 48px;
  }
  .lightbox.open { display: flex; animation: cardIn .2s both; }
  .lb-stage { flex: 1; display: grid; place-items: center; max-width: 92vw; min-height: 0; }
  .lb-stage img {
    max-width: 100%; max-height: 78vh; border-radius: var(--radius-cards);
    box-shadow: var(--shadow-inset-border), var(--shadow-xl); background: var(--color-obsidian);
  }
  .lb-close {
    position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: var(--radius-mini);
    background: var(--color-charcoal); border: 1px solid var(--color-graphite);
    color: var(--color-fog); cursor: pointer; display: grid; place-items: center;
    transition: all .15s; z-index: 2;
  }
  .lb-close:hover { color: var(--color-snow); border-color: var(--color-iron); }
  .lb-bar {
    display: flex; align-items: center; gap: 16px; margin-top: 20px;
    background: var(--color-charcoal); border-radius: var(--radius-pills);
    box-shadow: var(--shadow-inset-border), var(--shadow-sm);
    padding: 8px 10px 8px 18px;
  }
  .lb-title { font-size: var(--text-body-sm); font-weight: var(--w-510); color: var(--color-snow); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-actions { display: flex; gap: 8px; }
  .lb-btn {
    font-family: var(--font-inter); font-size: var(--text-body-sm); font-weight: var(--w-reg);
    background: transparent; color: var(--color-snow); border: 1px solid var(--color-iron);
    border-radius: var(--radius-pills); padding: 6px 14px; cursor: pointer; transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .lb-btn:hover { border-color: var(--color-platinum); }
  .lb-btn.ok { border-color: var(--color-emerald); color: var(--color-emerald); }

  /* ============ Responsive view tiers ============
     body.canvas  -> spatial pan/zoom board (fine pointer, wide)
     body.grid    -> masonry of cards, tap to open (tablet / touch / mid-width)
     body.feed    -> single-column vertical feed (narrow / phone)
     body.flat    -> shared base for grid + feed (no pan/zoom, persistent affordances) */
  .fab { display: none; }

  /* --- Shared "flat" behavior (grid + feed) --- */
  body.flat #viewport { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; cursor: default; -webkit-overflow-scrolling: touch; }
  body.flat #world { transform: none !important; position: static; }
  body.flat #links, body.flat .zoom, body.flat .hint, body.flat #netBtn, body.flat .grid { display: none !important; }
  body.flat .card { position: static !important; cursor: pointer; animation: none; }
  body.flat .card-actions { opacity: 1; }
  body.flat .mini { width: 32px; height: 32px; }
  body.flat .status-badge { padding: 4px 11px 4px 9px; }
  body.flat #addBtn { display: none; }
  body.flat .fab {
    display: grid; place-items: center; position: fixed; right: 20px; bottom: 24px; z-index: 70;
    width: 54px; height: 54px; border-radius: 50%; corner-shape: superellipse(2.4); border: none; cursor: pointer;
    position: relative; overflow: hidden;
    background:
      radial-gradient(75% 130% at var(--p1x) var(--p1y), #43e97b 12%, transparent 60%),
      radial-gradient(80% 140% at var(--p2x) var(--p2y), #66a6ff 10%, transparent 62%),
      linear-gradient(120deg, #38f9d7, #66a6ff);
    color: #08090a; line-height: 1;
    box-shadow: var(--shadow-stack), var(--shadow-xl);
    animation: liquid-flow 5s ease-in-out infinite;
  }
  body.flat .modal { max-height: 86vh; overflow-y: auto; }

  /* --- Compact topbar when stacked (narrow widths only) --- */
  body.flat.narrow .topbar { height: auto; flex-wrap: wrap; align-items: center; padding: 10px 14px 12px; gap: 10px; row-gap: 10px; }
  body.flat.narrow .brand { font-size: 15px; }
  body.flat.narrow .brand .sub { display: none; }
  body.flat.narrow .save-status { font-size: 10px; }
  body.flat.narrow .search-wrap { order: 10; flex: 1 1 100%; max-width: none; }
  body.flat.narrow .search { height: 38px; font-size: 16px; }
  body.flat.narrow .topbar .btn { padding: 6px 10px; }
  body.flat.narrow .tagrail { top: 103px; padding: 10px 14px; }
  body.flat.narrow .panel { top: 103px; width: 100%; }
  body.flat.narrow .lightbox { padding: 16px; }
  body.flat.narrow .empty-state { padding-top: 140px; align-items: start; }

  /* --- FEED: single column --- */
  body.feed #world { display: flex; flex-direction: column; gap: 14px; padding: 168px 16px 110px; max-width: 560px; margin: 0 auto; }
  body.feed:not(.narrow) #world { padding-top: 124px; }
  body.feed .card { width: 100% !important; }
  body.feed .card img { max-height: 320px; }

  /* --- GRID: responsive masonry via CSS columns --- */
  body.grid #world {
    column-gap: 16px; padding: 124px 24px 120px; margin: 0 auto; max-width: 1500px;
    columns: 3 300px;
  }
  body.grid.narrow #world { padding: 168px 16px 110px; column-gap: 14px; columns: 2 240px; }
  body.grid .card {
    width: 100% !important; break-inside: avoid; margin: 0 0 16px;
    display: inline-block; /* prevents column-break artifacts */
  }
  body.grid.narrow .card { margin-bottom: 14px; }
  body.grid .card img { max-height: 260px; }
  /* the gradient hover spin still works on grid with a fine pointer */
  body.grid.has-hover .card.has-grad:hover { animation: grad-rotate 3s linear infinite; }

  /* zoom controls */
  .zoom { position: fixed; left: 24px; bottom: 24px; z-index: 45; display: flex; flex-direction: column; gap: 6px; }
  .zoom button {
    width: 36px; height: 36px; border-radius: var(--radius-mini);
    background: var(--color-charcoal); border: 1px solid var(--color-graphite);
    color: var(--color-fog); cursor: pointer;
    display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: all .15s;
  }
  .zoom button:hover { color: var(--color-snow); border-color: var(--color-iron); }

  /* ============ Tag gradients — neon border layer ============
     Card body stays charcoal; the primary tag's duotone lives in the
     border stroke + an ambient glow. The stroke flows (conic spin) and
     the glow blooms on hover. */
  @property --ga  { syntax: '<angle>'; initial-value: 135deg; inherits: false; }
  @property --p1x { syntax: '<percentage>'; initial-value: 15%; inherits: false; }
  @property --p1y { syntax: '<percentage>'; initial-value: 20%; inherits: false; }
  @property --p2x { syntax: '<percentage>'; initial-value: 85%; inherits: false; }
  @property --p2y { syntax: '<percentage>'; initial-value: 80%; inherits: false; }

  .card.has-grad {
    border: 2px solid transparent; border-radius: var(--radius-cards); corner-shape: squircle;
    background:
      linear-gradient(var(--color-charcoal), var(--color-charcoal)) padding-box,
      conic-gradient(from var(--ga), var(--g1), var(--g2), var(--g1)) border-box;
    /* faint ambient glow at rest so the colored edge reads on the onyx canvas */
    box-shadow:
      0 0 22px -6px color-mix(in srgb, var(--g1) 30%, transparent),
      0 0 8px -2px color-mix(in srgb, var(--g2) 22%, transparent),
      var(--shadow-sm);
    transition: box-shadow .35s ease;
  }
  .card.has-grad:hover {
    animation: grad-rotate 3s linear infinite;
    box-shadow:
      0 0 44px -4px color-mix(in srgb, var(--g1) 55%, transparent),
      0 0 16px -2px color-mix(in srgb, var(--g2) 48%, transparent),
      var(--shadow-sm);
  }
  .card.has-grad.dragging {
    animation: grad-rotate 3s linear infinite;
    box-shadow: 0 0 44px -4px color-mix(in srgb, var(--g1) 55%, transparent), var(--shadow-xl);
  }
  .card.has-grad.resurfaced { box-shadow: 0 0 0 3px var(--indigo-tint-2), var(--shadow-xl); }
  @keyframes grad-rotate { to { --ga: 495deg; } }
  @keyframes liquid-flow {
    0%   { --p1x:15%; --p1y:20%; --p2x:85%; --p2y:80%; }
    33%  { --p1x:75%; --p1y:30%; --p2x:20%; --p2y:65%; }
    66%  { --p1x:35%; --p1y:80%; --p2x:80%; --p2y:15%; }
    100% { --p1x:15%; --p1y:20%; --p2x:85%; --p2y:80%; }
  }
  body.flat .card.has-grad { animation: none; }

  /* Gradient identity dot — shared by rail chips, card badges, picker chips */
  .gdot {
    width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block;
    background: linear-gradient(135deg, var(--g1), var(--g2));
  }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; }
  .tag-chip.on {
    background: linear-gradient(135deg, var(--g1), var(--g2));
    border-color: transparent; color: #08090a; font-weight: var(--w-510);
  }
  .tag-chip.on .gdot { background: rgba(8,9,10,0.35); }
  .tag-chip.on .cnt { color: rgba(8,9,10,0.6); }
  .tag-chip.all.on { background: var(--color-obsidian); border-color: var(--color-platinum); color: var(--color-snow); font-weight: var(--w-reg); }
  .tag-chip.all.on .cnt { color: var(--color-fog); }

  .card .ct { display: inline-flex; align-items: center; gap: 5px; }
  .card .ct .gdot { width: 6px; height: 6px; }
  .card .ct[data-tag] { cursor: pointer; transition: border-color .15s; }
  .card .ct[data-tag]:hover { border-color: var(--color-iron); }
  .card .ct.primary { border-color: var(--color-iron); }

  .tp-tag { display: inline-flex; align-items: center; gap: 6px; }
  .tp-tag.on {
    background: linear-gradient(135deg, var(--g1), var(--g2));
    border-color: transparent; color: #08090a; font-weight: var(--w-510);
  }
  .tp-tag.on .gdot { background: rgba(8,9,10,0.35); }

  /* Manage-tags: swatch + inline gradient editor */
  .gswatch {
    width: 22px; height: 22px; border-radius: 6px; flex: none; cursor: pointer;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: var(--shadow-inset-border); transition: transform .12s;
  }
  .gswatch:hover { transform: scale(1.1); }
  .mtag-row { flex-wrap: wrap; }
  .gedit { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding-top: 10px; }
  .gedit .gopt {
    width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
    box-shadow: var(--shadow-inset-border); transition: transform .12s; padding: 0;
  }
  .gedit .gopt:hover { transform: scale(1.18); }
  .gedit .gsep { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-slate); margin-left: 4px; }
  .gedit input[type=color] {
    width: 26px; height: 22px; border: none; border-radius: 6px; background: var(--color-steel);
    padding: 1px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .card.has-grad, .card.has-grad:hover, .btn.active:hover, body.flat .fab { animation: none !important; }
  }
</style>

</head>
<body>
  <div class="atmosphere">
    <div class="blob green"></div>
    <div class="blob amber"></div>
    <div class="blob red"></div>
  </div>
  <div class="grid" id="gridLayer"></div>

  <div id="viewport">
    <div id="world">
      <svg id="links"></svg>
    </div>
  </div>

  <header class="topbar">
    <div class="brand"><span class="dot"></span>Lumen <span class="sub">research canvas</span></div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="Search notes, tags, screenshot text…  ( / )" />
    </div>
    <div class="spacer"></div>
    <span class="save-status ok" id="saveStatus"><span class="ms">check</span> Synced</span>
    <button class="btn btn-icon" id="netBtn"><span class="ms">hub</span> Connections</button>
    <button class="btn btn-icon active" id="addBtn"><span class="ms">add</span> Add</button>
    <button class="btn btn-icon" id="signOutBtn" title="Sign out" style="display:none"><span class="ms">logout</span></button>
  </header>

  <div class="auth-gate" id="authGate" style="display:none">
    <div class="auth-card">
      <div class="brand" style="justify-content:center; margin-bottom:6px"><span class="dot"></span>Lumen</div>
      <p class="auth-lede">Sign in to sync your canvas across devices.</p>
      <input id="authEmail" type="email" placeholder="you@email.com" autocomplete="username"/>
      <input id="authPass" type="password" placeholder="Password" autocomplete="current-password"/>
      <div id="authMsg" class="auth-msg"></div>
      <button class="btn active" id="authSignIn" style="width:100%; justify-content:center; margin-top:4px">Sign in</button>
      <button class="btn" id="authSignUp" style="width:100%; justify-content:center; margin-top:8px">Create account</button>
    </div>
  </div>

  <nav class="tagrail" id="tagrail"></nav>

  <div class="zoom">
    <button id="zin" title="Zoom in"><span class="ms">add</span></button>
    <button id="zout" title="Zoom out"><span class="ms">remove</span></button>
    <button id="zfit" title="Reset view"><span class="ms">fit_screen</span></button>
  </div>

  <!-- Add modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>Add to canvas</h3>
      <div class="seg" id="typeSeg">
        <button data-t="note" class="on">Note</button>
        <button data-t="link">Link</button>
        <button data-t="embed">Embed</button>
      </div>
      <div id="fTitle"><label>Title</label><input id="mTitle" placeholder="e.g. Stripe's onboarding flow"/></div>
      <div id="fUrl" style="display:none"><label>URL (link or YouTube)</label><input id="mUrl" placeholder="https://…"/></div>
      <label>Note</label>
      <textarea id="mNote" placeholder="Details, context, anything to remember…"></textarea>
      <label>Why save this?</label>
      <textarea id="mReason" placeholder="A quick note to future you…"></textarea>
      <label>Tags</label>
      <div class="tagpicker" id="mTagPicker"></div>
      <div class="row">
        <button class="btn" id="mCancel">Cancel</button>
        <button class="btn active" id="mSave">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="manageBg">
    <div class="modal">
      <h3>Manage tags</h3>
      <p class="lede" style="font-size:var(--text-caption); color:var(--color-fog); margin-bottom:8px; line-height:1.5">Add a tag to make it available everywhere, or delete one to remove it from every card. This can't be undone.</p>
      <div style="display:flex; gap:8px; margin-bottom:8px">
        <input id="mtagNew" placeholder="New tag name…" style="flex:1"/>
        <button class="btn active" id="mtagAdd">Add</button>
      </div>
      <div id="mtagList" style="max-height:300px; overflow-y:auto"></div>
      <div class="row">
        <button class="btn active" id="manageClose">Done</button>
      </div>
    </div>
  </div>

  <button class="fab" id="fabAdd" title="Add"><span class="ms">add</span></button>

  <div class="empty-state" id="emptyState"><div class="es-inner"></div></div>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose" title="Close"><span class="ms">close</span></button>
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt=""/>
    </div>
    <div class="lb-bar">
      <span class="lb-title" id="lbTitle"></span>
      <div class="lb-actions">
        <button class="lb-btn" id="lbCopy"><span class="ms">content_copy</span> Copy</button>
        <button class="lb-btn" id="lbDownload"><span class="ms">download</span> Download</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   SUPABASE CONFIG — paste your project's values here.
   Find them in: Supabase dashboard → Project Settings → API Keys.
   Copy the "publishable" key (format: sb_publishable_...). This is
   the current key for client-side use — it replaced the old "anon"

/* base64 dataURL -> Blob (for uploading pasted images) */
function b64ToBlob(dataUrl){
  const [head,b64]=dataUrl.split(','); const mime=(head.match(/data:([^;]+)/)||[])[1]||'image/png';
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

/* ---------------- Tag gradients ---------------- */
/* 12 curated duotones tuned for the onyx canvas (How-We-Feel quadrant logic:
   warm/high-energy -> cool/calm). Beyond 12, hue-shifted variants keep every tag unique. */
const GRADIENTS = [
  ['#ffd166','#ff7b54'], ['#ff7eb3','#ff5277'], ['#ff9a5c','#e84393'], ['#f7971e','#ffd200'],
  ['#84fab0','#8fd3f4'], ['#43e97b','#38f9d7'], ['#5ee7df','#66a6ff'], ['#30cfd0','#5b6bff'],
  ['#6a8dff','#9b6dff'], ['#a18cd1','#fbc2eb'], ['#c471f5','#fa71cd'], ['#f6d365','#fda085'],
];
let tagStyles = {}; // tag -> {g1,g2}, persisted in user_meta key 'tagStyles'

function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,sv=0,l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; sv=l>0.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }
  return [h,sv,l];
}
function hslToHex(h,sv,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*sv, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function hueShift(hex,deg){ const [h,sv,l]=hexToHsl(hex); return hslToHex(h+deg,sv,l); }

function ensureTagStyle(t){
  if(tagStyles[t]) return tagStyles[t];
  const n = Object.keys(tagStyles).length;
  const base = GRADIENTS[n % GRADIENTS.length];
  const shift = Math.floor(n / GRADIENTS.length) * 25;
  tagStyles[t] = shift
    ? { g1: hueShift(base[0],shift), g2: hueShift(base[1],shift) }
    : { g1: base[0], g2: base[1] };
  scheduleSave();
  return tagStyles[t];
}
function setTagVars(el, t){
  const st = ensureTagStyle(t);
  el.style.setProperty('--g1', st.g1);
  el.style.setProperty('--g2', st.g2);
}
function setTagStyle(t, g1, g2){
  tagStyles[t] = { g1, g2 };
  // repaint everything that wears this tag
  cards.forEach(c=>{ if(c.tags.includes(t) && c.el){ c.el.remove(); c.el=null; buildCardEl(c); } });
  renderTags(); applyFilter(); if(netMode) drawLinks();
  scheduleSave();
}

/* Analyze an image data-URL: returns {mode, palette} via an offscreen canvas.
   mode = 'light' | 'dark' (avg perceived luminance).
   palette = array of 4 dominant hex colors (coarse quantization + frequency). */
function analyzeImage(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const W=64, H=Math.max(1, Math.round(64*img.height/img.width));
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img,0,0,W,H);
      let data;
      try { data = ctx.getImageData(0,0,W,H).data; }
      catch(e){ resolve({mode:null, palette:null}); return; } // tainted canvas
      let lumSum=0, n=0;
      const buckets={};
      for(let i=0;i<data.length;i+=4){
        const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
        if(a<128) continue;
        // perceived luminance
        lumSum += 0.2126*r + 0.7152*g + 0.0722*b; n++;
        // quantize to 5 levels/channel for clustering
        const key = (r>>5)+'-'+(g>>5)+'-'+(b>>5);
        if(!buckets[key]) buckets[key]={count:0, r:0, g:0, b:0};
        const bk=buckets[key]; bk.count++; bk.r+=r; bk.g+=g; bk.b+=b;
      }
      const avgLum = n? lumSum/n : 128;
      const mode = avgLum < 128 ? 'dark' : 'light';
      // top buckets by frequency, averaged to real color, deduped by closeness
      const sorted = Object.values(buckets).sort((a,b)=>b.count-a.count);
      const palette=[];
      for(const bk of sorted){
        const r=Math.round(bk.r/bk.count), g=Math.round(bk.g/bk.count), b=Math.round(bk.b/bk.count);
        const tooClose = palette.some(p=>Math.abs(p[0]-r)+Math.abs(p[1]-g)+Math.abs(p[2]-b) < 40);
        if(!tooClose) palette.push([r,g,b]);
        if(palette.length>=4) break;
      }
      const hex = palette.map(([r,g,b])=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''));
      resolve({mode, palette: hex});
    };
    img.onerror = ()=> resolve({mode:null, palette:null});
    img.src = dataUrl;
  });
}

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

/* Derive a clean human name from a URL's domain as a fallback */
function prettyDomain(url){
  try {
    const h = new URL(url).hostname.replace(/^www\./,'');
    const core = h.split('.')[0];
    return core.charAt(0).toUpperCase()+core.slice(1);
  } catch { return url; }
}

/* Fetch page metadata (SEO title, description, preview image).
   YouTube via oembed; everything else via Microlink (free tier, CORS-friendly),
   falling back to noembed, then prettyDomain. */
async function fetchMeta(url){
  const out = { title:null, description:null, image:null };
  try {
    if(ytId(url)){
      const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
      if(r.ok){ const j = await r.json(); out.title = j.title||null; out.image = j.thumbnail_url||null; return out; }
    }
    const r = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
    if(r.ok){
      const j = await r.json();
      if(j.status==='success' && j.data){
        out.title = j.data.title||null;
        out.description = j.data.description||null;
        out.image = j.data.image?.url || j.data.logo?.url || null;
        return out;
      }
    }
  } catch(e){ /* fall through */ }
  try {
    const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
    if(r.ok){ const j = await r.json(); if(j.title) out.title = j.title; }
  } catch(e){ /* offline / CORS */ }
  return out;
}

/* Update a card's metadata async, then refresh visuals.
   Preserves an open popover (only swaps text in place while it's open). */
function hydrateTitle(c){
  fetchMeta(c.url).then(meta=>{
    let changed = false;
    if(meta.title && (c.title==='Untitled' || c.title===prettyDomain(c.url) || c.title==='YouTube video…' || !c.title)){ c.title = meta.title; changed = true; }
    else if(meta.title && meta.title!==c.title && c.type!=='note'){ c.title = meta.title; changed = true; }
    if(meta.description && !c.description){ c.description = meta.description; changed = true; }
    if(meta.image && !c.ogImage && c.type==='link'){ c.ogImage = meta.image; changed = true; }
    if(!changed) return;
    const pop = c.el?.querySelector('.card-tagpop');
    if(pop){
      const ttl = c.el.querySelector('.ttl'); if(ttl) ttl.textContent = c.title;
      refreshSuggestions(c);
    } else if(c.el){
      c.el.remove(); c.el = null; buildCardEl(c);
    }
    markDirty(c);
  });
}
function ageLabel(c){
  const d = Math.floor((Date.now()-c.touchedAt)/DAY);
  if (d<1) return 'today'; if (d===1) return '1d'; if (d<30) return d+'d';
  return Math.floor(d/30)+'mo';
}

/* Saved-on date as "26th May, 2026" */
function savedDate(c){
  const dt = new Date(c.createdAt);
  const day = dt.getDate();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const suffix = (n)=>{
    if(n>=11 && n<=13) return 'th';
    switch(n%10){ case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }
  };
  return `${day}${suffix(day)} ${months[dt.getMonth()]}, ${dt.getFullYear()}`;
}

function buildCardEl(c){
  const el = document.createElement('div');
  el.className = 'card'; el.dataset.id = c.id; el.dataset.status = c.status||'idea';
  const incomplete = !c.tags.length || !c.reason;

  el.style.left = c.x+'px'; el.style.top = c.y+'px';

  let media = '';
  if (c.type==='image' && c.img) {
    media = c.url
      ? `<a href="${c.url}" target="_blank" rel="noopener"><img src="${c.img}" alt=""></a>`
      : `<img src="${c.img}" alt="">`;
  }
  else if (c.type==='embed' && ytId(c.url)) media = `<iframe class="embed" src="https://www.youtube.com/embed/${ytId(c.url)}" frameborder="0" allowfullscreen></iframe>`;
  else if (c.type==='link' && c.ogImage) media = `<a href="${c.url}" target="_blank" rel="noopener"><img src="${c.ogImage}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`;

  const linkHtml = (c.url && c.type!=='embed') ? `<a class="link" href="${c.url}" target="_blank" rel="noopener">${prettyDomain(c.url)}</a>` : '';
  const tagsHtml = c.tags.map((t,i)=>{
    const st = ensureTagStyle(t);

  }).join('');
  const reasonHtml = c.reason ? `<div class="reason"><span class="reason-mark">why</span>${c.reason}</div>` : '';

  const paletteHtml = (c.palette && c.palette.length)

    : '';
  const STATUS = {idea:'Idea', building:'Building', done:'Done'};

  const needsHtml = (!c.tags.length || !c.reason) ? `<button class="ct needs" data-act="ctx" title="Add tags and a reason">needs context</button>` : '';

  const copyBtnHtml = c.note ? `<button class="mini" data-act="copy" title="Copy text"><span class="ms">content_copy</span></button>` : '';

  el.innerHTML = `
    <div class="card-actions">
      ${copyBtnHtml}

      ${c.note?`<div class="note">${c.note}</div>`:''}
      ${ocrHtml}
      ${reasonHtml}
      <div class="meta">${statusHtml}${tagsHtml}${needsHtml}<span class="age">${savedDate(c)}</span></div>
    </div>`;
  c.el = el;
  world.appendChild(el);
  wireCard(c);
  return el;
}

function matches(c){

    if(b) b.onclick = ()=>{
      query=''; const si=document.getElementById('search'); if(si) si.value='';
      activeTags.clear(); activeStatuses.clear(); renderTags(); applyFilter();
    };
  } else {
    es.classList.remove('show');
  }
}

/* Re-measure topbar + rail so flat-tier content offset stays correct
   when the rail height changes (tags added/removed, topbar wraps). */
function remeasureOffsets(){
  if(document.body.classList.contains('canvas')) return;
  const topbar = document.querySelector('.topbar');
  const rail = document.querySelector('.tagrail');
  if(!topbar || !rail) return;
  requestAnimationFrame(()=>{
    const th = topbar.offsetHeight;
    rail.style.top = th + 'px';
    world.style.paddingTop = (th + rail.offsetHeight + 16) + 'px';
  });
}

function renderTags(){
  const counts = {};
  cards.forEach(c=>c.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  globalTags.forEach(t=>{ if(!(t in counts)) counts[t]=0; });
  const tags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  tagrail.innerHTML = '';
  const allChip = chip('All', cards.length, activeTags.size===0);
  allChip.onclick = ()=>{ activeTags.clear(); renderTags(); applyFilter(); };
  tagrail.appendChild(allChip);

  // --- status filter chips (lifecycle) ---
  const stCounts = {idea:0, building:0, done:0};
  cards.forEach(c=>{ stCounts[c.status||'idea']++; });
  const STLABEL = {idea:'Idea', building:'Building', done:'Done'};
  ['idea','building','done'].forEach(st=>{
    const sc = document.createElement('button');
    sc.className = 'tag-chip st-chip st-'+st+(activeStatuses.has(st)?' on':'');
    sc.innerHTML = `<span class="st-dot"></span>${STLABEL[st]}<span class="cnt">${stCounts[st]}</span>`;
    sc.onclick = ()=>{ activeStatuses.has(st)?activeStatuses.delete(st):activeStatuses.add(st);
      renderTags(); applyFilter(); };
    tagrail.appendChild(sc);
  });
  const div = document.createElement('span'); div.className='rail-div'; tagrail.appendChild(div);

  tags.forEach(t=>{
    const ch = chip(t, counts[t], activeTags.has(t), t);
    ch.onclick = ()=>{ activeTags.has(t)?activeTags.delete(t):activeTags.add(t);
      renderTags(); applyFilter(); drawLinks(); };
    tagrail.appendChild(ch);
  });
  // explicit clear-filter button, only when a filter is active
  if(activeTags.size>0 || activeStatuses.size>0){
    const clear = document.createElement('button');
    clear.className = 'tag-chip clear-filter';
    clear.innerHTML = `Clear filter <span class="ms" style="font-size:12px;vertical-align:-2px">close</span>`;
    clear.onclick = ()=>{ activeTags.clear(); activeStatuses.clear(); renderTags(); applyFilter(); };
    tagrail.appendChild(clear);
  }
  // manage tags (global delete), only when tags exist
  if(tags.length>0){
    const manage = document.createElement('button');
    manage.className = 'tag-chip manage';
    manage.innerHTML = `<span class="ms" style="font-size:13px;vertical-align:-2.5px">settings</span> Manage tags`;
    manage.onclick = openManageTags;
    tagrail.appendChild(manage);
  }
  remeasureOffsets();
}
function chip(label,count,on,tag){
  const b = document.createElement('button');
  b.className = 'tag-chip'+(on?' on':'')+(tag?'':' all');
  b.innerHTML = `${tag?'<span class="gdot"></span>':''}${label}<span class="cnt">${count}</span>`;
  if(tag) setTagVars(b, tag);
  return b;
}

/* All distinct tags across the canvas (card tags + globally-created tags) */
function allTags(){
  const s = new Set(globalTags);
  cards.forEach(c=>c.tags.forEach(t=>s.add(t)));
  return [...s].sort();
}

/* ---------------- Manage tags (global add + delete) ---------------- */
function deleteTagGlobally(tag){
  const affected = cards.filter(c=>c.tags.includes(tag));
  cards.forEach(c=>{ c.tags = c.tags.filter(t=>t!==tag); });
  globalTags = globalTags.filter(t=>t!==tag);
  delete tagStyles[tag];
  activeTags.delete(tag);
  cards.forEach(c=>{ if(c.el){ c.el.remove(); c.el=null; buildCardEl(c); } });
  renderTags(); applyFilter(); if(netMode) drawLinks();
  affected.forEach(markDirty); scheduleSave(); // scheduleSave covers globalTags meta
}
function addGlobalTag(name){
  const t = name.trim().toLowerCase();
  if(!t) return false;
  if(allTags().includes(t)) return false; // already exists
  globalTags.push(t);
  renderTags();
  scheduleSave(); // persists globalTags meta
  return true;
}
function renderManageList(){
  const counts = {};
  cards.forEach(c=>c.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  const tags = allTags(); // includes global (0-card) tags
  const list = document.getElementById('mtagList');
  if(tags.length===0){ list.innerHTML = `<p class="lede" style="margin-top:16px">No tags yet — add one above.</p>`; return; }
  list.innerHTML = '';
  tags.forEach(t=>{
    const n = counts[t]||0;
    const row = document.createElement('div'); row.className='mtag-row';
    const label = n>0 ? `${n} card${n>1?'s':''}` : 'unused';
    row.innerHTML = `<span class="gswatch" title="Change gradient"></span>
                     <span class="name" style="flex:1">${t}<span class="c">${label}</span></span>
                     <button class="mtag-del">Delete</button>`;
    const sw = row.querySelector('.gswatch');
    setTagVars(sw, t);
    sw.onclick = ()=> toggleGradEditor(row, t);
    row.querySelector('.mtag-del').onclick = ()=>{ deleteTagGlobally(t); renderManageList(); };
    list.appendChild(row);
  });
}
/* Inline duotone editor: 12 presets + custom two-stop builder ("add more if needed") */
function toggleGradEditor(row, t){
  const open = row.querySelector('.gedit');
  if(open){ open.remove(); return; }
  document.querySelectorAll('.gedit').forEach(e=>e.remove()); // one editor at a time
  const ed = document.createElement('div'); ed.className = 'gedit';
  GRADIENTS.forEach(([g1,g2])=>{
    const b = document.createElement('button');
    b.className = 'gopt'; b.title = `${g1} → ${g2}`;
    b.style.background = `linear-gradient(135deg, ${g1}, ${g2})`;
    b.onclick = ()=>{ setTagStyle(t, g1, g2); setTagVars(row.querySelector('.gswatch'), t); ed.remove(); };
    ed.appendChild(b);
  });
  const cur = ensureTagStyle(t);
  const sep = document.createElement('span'); sep.className='gsep'; sep.textContent='custom';
  const c1 = document.createElement('input'); c1.type='color'; c1.value=cur.g1; c1.title='Start color';
  const c2 = document.createElement('input'); c2.type='color'; c2.value=cur.g2; c2.title='End color';
  const apply = ()=>{ setTagStyle(t, c1.value, c2.value); setTagVars(row.querySelector('.gswatch'), t); };
  c1.oninput = apply; c2.oninput = apply;
  ed.append(sep, c1, c2);
  row.appendChild(ed);
}
function openManageTags(){ renderManageList(); document.getElementById('manageBg').classList.add('open'); }

/* Renders a selectable tag picker into `container`.
   `selected` is a live array that gets mutated as tags toggle.
   `onChange` fires after any change. */
function renderTagPicker(container, selected, onChange, card, filter){
  container.innerHTML = '';
  const f = (filter||'').trim().toLowerCase();
  // union of all existing tags and any tags already selected (incl. just-created ones)
  let existing = [...new Set([...allTags(), ...selected])].sort();
  if(f) existing = existing.filter(t=>t.includes(f) || selected.includes(t));
  const persist = ()=>{ if(card) markDirty(card); };
  existing.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tp-tag'+(selected.includes(t)?' on':'');
    b.innerHTML = `<span class="gdot"></span>${t}`;
    setTagVars(b, t);
    b.onclick = ()=>{
      const i = selected.indexOf(t);
      if(i>=0) selected.splice(i,1); else selected.push(t);
      renderTagPicker(container, selected, onChange, card, filter);
      onChange && onChange();
      persist();
    };
    container.appendChild(b);
  });
  // inline input: type to search tags, Enter to create/select
  const inp = document.createElement('input');
  inp.className = 'tp-new'; inp.placeholder = 'Search or add tag…';
  inp.value = filter||'';
  inp.oninput = ()=>{
    const v = inp.value;
    renderTagPicker(container, selected, onChange, card, v);
    const ni = container.querySelector('.tp-new');
    ni.focus(); ni.setSelectionRange(v.length, v.length);
  };
  inp.onkeydown = e=>{
    if(e.key==='Enter'){
      const val = inp.value.trim().toLowerCase();
      if(val && !selected.includes(val)) selected.push(val);
      renderTagPicker(container, selected, onChange, card, '');
      onChange && onChange();
      persist();
    }
  };
  container.appendChild(inp);
}

/* ---------------- Connections (shared-tag network) ---------------- */
function drawLinks(){
  linksSvg.innerHTML = '';
  if(!netMode) return;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(SVGNS,'defs');
  linksSvg.appendChild(defs);
  let gi = 0;
  for(let i=0;i<cards.length;i++){
    for(let j=i+1;j<cards.length;j++){
      const a=cards[i], b=cards[j];
      if(a.hidden || b.hidden) continue;
      const shared = a.tags.filter(t=>b.tags.includes(t));
      if(shared.length===0) continue;
      const hot = [...activeTags].some(t=>shared.includes(t));
      // line wears the gradient of the filtered shared tag if any, else the first shared tag
      const tag = [...activeTags].find(t=>shared.includes(t)) || shared[0];
      const st = ensureTagStyle(tag);
      const x1=a.x+a.el.offsetWidth/2, y1=a.y+a.el.offsetHeight/2;
      const x2=b.x+b.el.offsetWidth/2, y2=b.y+b.el.offsetHeight/2;
      const grad = document.createElementNS(SVGNS,'linearGradient');
      const gid = 'lg'+(gi++);
      grad.setAttribute('id', gid);
      grad.setAttribute('gradientUnits','userSpaceOnUse');
      grad.setAttribute('x1',x1); grad.setAttribute('y1',y1);
      grad.setAttribute('x2',x2); grad.setAttribute('y2',y2);
      const s1=document.createElementNS(SVGNS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color',st.g1);
      const s2=document.createElementNS(SVGNS,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color',st.g2);
      grad.appendChild(s1); grad.appendChild(s2);
      defs.appendChild(grad);
      const line = document.createElementNS(SVGNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke', `url(#${gid})`);
      line.setAttribute('stroke-width', hot?2:1.5);
      line.setAttribute('stroke-opacity', hot?1:0.4);
      linksSvg.appendChild(line);
    }
  }
}

/* ---------------- Pan / zoom ---------------- */
function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  gridLayer.style.backgroundPosition = `${view.x}px ${view.y}px`;
  gridLayer.style.backgroundSize = `${32*view.k}px ${32*view.k}px`;
}
let panning=false, panStart=null;
viewport.addEventListener('mousedown', e=>{
  if(!document.body.classList.contains('canvas')) return;
  if(e.target.closest('.card')) return;
  panning=true; viewport.classList.add('panning');
  panStart={x:e.clientX-view.x, y:e.clientY-view.y};
});
window.addEventListener('mousemove', e=>{
  if(!panning) return;
  view.x=e.clientX-panStart.x; view.y=e.clientY-panStart.y; applyView();
});
window.addEventListener('mouseup', ()=>{ panning=false; viewport.classList.remove('panning'); });
viewport.addEventListener('wheel', e=>{
  if(!document.body.classList.contains('canvas')) return;
  e.preventDefault();
  const f = e.deltaY<0 ? 1.1 : 0.9;
  const nk = Math.min(2.5, Math.max(0.3, view.k*f));
  const r = nk/view.k;
  view.x = e.clientX - (e.clientX-view.x)*r;
  view.y = e.clientY - (e.clientY-view.y)*r;
  view.k = nk; applyView();
}, {passive:false});

document.getElementById('zin').onclick = ()=>{ view.k=Math.min(2.5,view.k*1.2); applyView(); };
document.getElementById('zout').onclick = ()=>{ view.k=Math.max(0.3,view.k*0.83); applyView(); };
document.getElementById('zfit').onclick = ()=>{ if(cards.some(c=>!c.hidden)) fitToContent(); else { view.x=120; view.y=60; view.k=1; applyView(); } };

/* ---------------- Fit-to-content view helpers ---------------- */
function fitToContent(){
  if(cards.length===0) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  cards.filter(c=>!c.hidden).forEach(c=>{
    const w=c.el?.offsetWidth||252, h=c.el?.offsetHeight||200;
    minX=Math.min(minX,c.x); minY=Math.min(minY,c.y);
    maxX=Math.max(maxX,c.x+w); maxY=Math.max(maxY,c.y+h);
  });
  if(minX===Infinity) return;
  const pad=80;
  const cw=maxX-minX+pad*2, ch=maxY-minY+pad*2;
  const vw=window.innerWidth, vh=window.innerHeight-120;
  const k=Math.min(1, Math.min(vw/cw, vh/ch));
  const tx=(vw-cw*k)/2 - (minX-pad)*k;
  const ty=120 + (vh-ch*k)/2 - (minY-pad)*k;
  animateView(tx,ty,k);
}
function animateView(tx,ty,tk){
  const sx=view.x, sy=view.y, sk=view.k, t0=performance.now(), dur=420;
  function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); // easeOutCubic
    view.x=sx+(tx-sx)*e; view.y=sy+(ty-sy)*e; view.k=sk+(tk-sk)*e;
    applyView();
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------------- Card drag + actions ---------------- */
function wireCard(c){
  const el = c.el;
  let dragging=false, off=null, moved=false;
  el.addEventListener('mousedown', e=>{
    if(!document.body.classList.contains('canvas')) return;
    if(e.target.closest('.mini')||e.target.closest('a')||e.target.closest('iframe')||e.target.closest('.status-badge')) return;
    dragging=true; moved=false; el.classList.add('dragging');
    off={x:e.clientX-c.x*view.k - view.x, y:e.clientY-c.y*view.k - view.y};
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    moved=true;
    c.x=(e.clientX-off.x-view.x)/view.k; c.y=(e.clientY-off.y-view.y)/view.k;
    el.style.left=c.x+'px'; el.style.top=c.y+'px';
    if(netMode) drawLinks();
  });
  window.addEventListener('mouseup', ()=>{
    if(dragging){ dragging=false; el.classList.remove('dragging'); if(moved){ c.touchedAt=Date.now(); markDirty(c); } }
  });
  el.querySelector('[data-act="del"]').onclick = async ()=>{
    cards=cards.filter(x=>x!==c); el.remove(); renderTags(); drawLinks(); applyFilter();
    if(c.imagePath) await store.deleteImage(c.imagePath);
    await store.deleteCard(c.id);
    scheduleSave();
  };
  el.querySelector('[data-act="edit"]').onclick = ()=> openModal(c);
  el.querySelectorAll('.ct[data-tag]').forEach(badge=>{
    badge.onclick = e=>{
      e.stopPropagation();
      const t = badge.dataset.tag;
      if(c.tags[0]===t || c.tags.length<2) return;
      c.tags = [t, ...c.tags.filter(x=>x!==t)];
      c.el.remove(); c.el=null; buildCardEl(c);
      if(netMode) drawLinks();
      markDirty(c);
    };
  });
  const ctxBtn = el.querySelector('[data-act="ctx"]');
  if(ctxBtn) ctxBtn.onclick = e=>{ e.stopPropagation(); openCardTagPicker(c); };
  const statusBtn = el.querySelector('[data-act="status"]');
  if(statusBtn){
    statusBtn.onclick = e=>{
      e.stopPropagation();
      const order = ['idea','building','done'];
      c.status = order[(order.indexOf(c.status||'idea')+1)%order.length];
      const labels = {idea:'Idea', building:'Building', done:'Done'};
      statusBtn.className = 'status-badge '+c.status;
      statusBtn.textContent = labels[c.status];
      el.dataset.status = c.status;
      c.touchedAt = Date.now();
      markDirty(c);
      renderTags(); // refresh status counts
      // if a status filter is active this card may now drop out
      if(activeStatuses.size) applyFilter();
    };
  }
  const copyBtn = el.querySelector('[data-act="copy"]');
  if(copyBtn){
    copyBtn.onclick = async ()=>{
      try {
        await navigator.clipboard.writeText(c.note||'');
        const prev = copyBtn.innerHTML; copyBtn.innerHTML='<span class="ms">check</span>';
        setTimeout(()=>{ copyBtn.innerHTML=prev; }, 1200);
      } catch(err){
        copyBtn.title = 'Copy failed';
      }
    };
  }
  // double-click an image card to open the lightbox (canvas);
  // single tap in flat tiers, where there's no drag to disambiguate
  if(c.type==='image' && c.img){
    el.addEventListener('dblclick', e=>{
      if(e.target.closest('.mini')||e.target.closest('.card-tagpop')) return;
      openLightbox(c);
    });
    el.addEventListener('click', e=>{
      if(document.body.classList.contains('canvas')) return;
      if(e.target.closest('.mini')||e.target.closest('a')||e.target.closest('.card-tagpop')||
         e.target.closest('.status-badge')||e.target.closest('.ct[data-tag]')||e.target.closest('[data-act="ctx"]')) return;
      openLightbox(c);
    });
  }
}

/* ---------------- OCR (text from screenshots) ---------------- */
let tessLoading = null;
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function runOCR(c){
  if(!c.img) return;
  try {
    await ensureTesseract();
    const { data } = await Tesseract.recognize(c.img, 'eng');
    const text = (data.text||'').replace(/\s+/g,' ').trim();
    if(text.length < 3) return;
    c.ocrText = text.slice(0, 4000);
    // refresh card (preserving an open popover) so the "text detected" flag + suggestions appear
    const pop = c.el?.querySelector('.card-tagpop');
    if(pop) refreshSuggestions(c);
    else if(c.el){ c.el.remove(); c.el=null; buildCardEl(c); }
    markDirty(c);
  } catch(e){ /* OCR is best-effort */ }
}

/* ---------------- Tag suggestions / auto-categorization ---------------- */
const DOMAIN_TAGS = {
  'youtube':'video','youtu':'video','vimeo':'video',
  'dribbble':'inspiration','behance':'inspiration','awwwards':'inspiration','mobbin':'inspiration',
  'figma':'design','github':'code','gitlab':'code','codepen':'code','stackoverflow':'code',
  'medium':'article','substack':'article','dev':'article',
  'twitter':'thread','x':'thread','reddit':'discussion',
  'notion':'docs','producthunt':'product','amazon':'shopping'
};
const KEYWORD_TAGS = [
  [/\b(onboarding|signup|sign up|log in|login)\b/i,'onboarding'],
  [/\b(pricing|plans?|subscription|billing)\b/i,'pricing'],
  [/\b(dashboard|analytics|metrics|chart)\b/i,'dashboard'],
  [/\b(landing page|hero|cta|call to action)\b/i,'landing'],
  [/\b(typograph|font|typeface)\b/i,'typography'],
  [/\b(animation|motion|transition)\b/i,'motion'],
  [/\b(checkout|cart|payment)\b/i,'checkout'],
  [/\b(navigation|navbar|menu|sidebar)\b/i,'navigation'],
  [/\b(form|input|field|validation)\b/i,'forms'],
  [/\b(empty state|error state|404)\b/i,'states'],
  [/\b(api|sdk|endpoint)\b/i,'dev'],
  [/\b(ai|gpt|llm|machine learning)\b/i,'ai'],
];
function suggestTags(c){
  const corpus = [c.title, c.note, c.reason, c.description, c.ocrText, c.url].join(' ').toLowerCase();
  const out = new Set();
  // 1) existing tags whose name appears in the card's content
  allTags().forEach(t=>{ if(t.length>2 && corpus.includes(t.toLowerCase())) out.add(t); });
  // 2) domain-based category
  if(c.url){
    try {
      const core = new URL(c.url).hostname.replace(/^www\./,'').split('.')[0];
      if(DOMAIN_TAGS[core]) out.add(DOMAIN_TAGS[core]);
    } catch{}
  }
  // 3) content keyword heuristics
  KEYWORD_TAGS.forEach(([re, tag])=>{ if(re.test(corpus)) out.add(tag); });
  // 4) type hints
  if(c.type==='image') out.add('screenshot');
  if(c.type==='embed') out.add('video');
  return [...out].filter(t=>!c.tags.includes(t)).slice(0,6);
}
/* Re-render the "Suggested" chips inside an open popover */
function refreshSuggestions(c){
  const pop = c.el?.querySelector('.card-tagpop'); if(!pop) return;
  const row = pop.querySelector('.sg-row'); if(!row) return;
  renderSuggestRow(row, c, ()=>{
    const host = pop.querySelector('.tp-host');
    if(host) renderTagPicker(host, c.tags, ()=>{ renderTags(); if(netMode) drawLinks(); }, c);
  });
}
function renderSuggestRow(row, c, after){
  const sugg = suggestTags(c);
  row.style.display = sugg.length ? '' : 'none';
  const lbl = row.previousElementSibling;
  if(lbl && lbl.classList.contains('ttl-pop')) lbl.style.display = sugg.length ? '' : 'none';
  row.innerHTML = '';
  sugg.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'sg-tag'; b.textContent = t; b.type = 'button';
    b.onclick = ()=>{
      if(!c.tags.includes(t)) c.tags.push(t);
      renderSuggestRow(row, c, after);
      after && after();
      renderTags(); markDirty(c);
    };
    row.appendChild(b);
  });
}


/* Opens combined "why + tags" picker on a card (used right after paste) */
function openCardTagPicker(c){
  const old = c.el.querySelector('.card-tagpop');
  if(old) old.remove();
  c.el.classList.add('popover-open'); // let popover overflow the card
  const pop = document.createElement('div');
  pop.className = 'card-tagpop';
  const linkFieldHtml = (c.type==='image')
    ? `<div class="ttl-pop" style="margin-bottom:6px">Link <span style="text-transform:none;font-weight:500;opacity:.7">(optional)</span></div>
       <input class="link-field" placeholder="https://where-you-found-it…" value="${c.url||''}"/>`
    : '';
  pop.innerHTML = `
    <div class="pop-head">
      <span class="ttl-pop">Why save this?</span>
      <button class="pop-x" title="Close"><span class="ms">close</span></button>
    </div>
    <textarea class="why-field" placeholder="A quick note to future you…">${c.reason||''}</textarea>
    ${linkFieldHtml}
    <div class="ttl-pop" style="margin-bottom:6px">Suggested</div>
    <div class="sg-row"></div>
    <div class="ttl-pop" style="margin-bottom:6px">Tags</div>
    <div class="tp-host"></div>
    <button class="done">Done</button>`;
  c.el.appendChild(pop);
  pop.addEventListener('mousedown', e=>e.stopPropagation());
  const why = pop.querySelector('.why-field');
  why.addEventListener('input', ()=>{ c.reason = why.value; });
  const linkField = pop.querySelector('.link-field');
  if(linkField) linkField.addEventListener('input', ()=>{ c.url = linkField.value.trim(); });
  const host = pop.querySelector('.tp-host');
  renderTagPicker(host, c.tags, ()=>{ renderTags(); if(netMode) drawLinks(); }, c);
  renderSuggestRow(pop.querySelector('.sg-row'), c, ()=>{
    renderTagPicker(host, c.tags, ()=>{ renderTags(); if(netMode) drawLinks(); }, c);
  });

  const close = ()=>{
    c.reason = why.value.trim();
    if(linkField) c.url = linkField.value.trim();
    pop.remove(); c.el.classList.remove('popover-open');
    c.el.remove(); c.el=null; buildCardEl(c);
    renderTags(); applyFilter();
    markDirty(c);
  };
  pop.querySelector('.done').onclick = close;
  pop.querySelector('.pop-x').onclick = close;
  setTimeout(()=>why.focus(), 60);
}

/* Run light/dark + palette analysis on an image card, then refresh it.
   Preserves an open popover by re-rendering only if needed. */
function analyzeAndRefresh(c){
  runOCR(c); // best-effort, async; refreshes the card when done
  analyzeImage(c.img).then(({mode, palette})=>{
    if(mode){
      c.mode = mode;
      const modeTag = mode+'-mode';
      if(!c.tags.includes(modeTag)) c.tags.push(modeTag);
    }
    if(palette) c.palette = palette;
    // refresh card visuals without destroying an open popover
    const pop = c.el?.querySelector('.card-tagpop');
    if(pop){
      // popover open: just refresh its tag picker so the new mode-tag shows
      const host = pop.querySelector('.tp-host');
      if(host) renderTagPicker(host, c.tags, ()=>{ renderTags(); if(netMode) drawLinks(); }, c);
      refreshSuggestions(c);
    } else if(c.el){
      c.el.remove(); c.el=null; buildCardEl(c);
    }
    renderTags(); applyFilter();
    markDirty(c);
  });
}

window.addEventListener('paste', e=>{
  // ignore paste while typing in an input/textarea
  if(e.target.matches('input, textarea')) return;
  const items = e.clipboardData?.items||[];
  for(const it of items){
    if(it.type.startsWith('image/')){
      const file = it.getAsFile();
      const reader = new FileReader();
      reader.onload = async ev=>{
        const c = addCard({type:'image', title:'Pasted screenshot', img:ev.target.result, tags:[]});
        await persistImage(c, ev.target.result);
        buildCardEl(c); renderTags(); openCardTagPicker(c);
        analyzeAndRefresh(c);
        markDirty(c);
      };
      reader.readAsDataURL(file); return;
    }
  }
  const text = e.clipboardData?.getData('text');
  if(!text) return;
  const trimmed = text.trim();
  let c;
  if(/^https?:\/\//.test(trimmed)){
    const isYt = ytId(trimmed);
    c = addCard({type:isYt?'embed':'link', title: isYt?'YouTube video…':prettyDomain(trimmed), url:trimmed, tags:[]});
    buildCardEl(c); renderTags(); openCardTagPicker(c);
    hydrateTitle(c);
    markDirty(c);
    return;
  } else {
    // plain text → note card
    c = addCard({type:'note', title: trimmed.slice(0,40)+(trimmed.length>40?'…':''), note:trimmed, tags:[]});
  }
  buildCardEl(c); renderTags(); openCardTagPicker(c);
  markDirty(c);
});
viewport.addEventListener('dragover', e=>e.preventDefault());
viewport.addEventListener('drop', e=>{
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = async ev=>{
      const c = addCard({type:'image', title:file.name, img:ev.target.result, tags:[],
        x:(e.clientX-view.x)/view.k, y:(e.clientY-view.y)/view.k});
      await persistImage(c, ev.target.result);
      buildCardEl(c); renderTags(); openCardTagPicker(c);
      analyzeAndRefresh(c);
      markDirty(c);
    };
    reader.readAsDataURL(file);
  }
});

/* Store an image card's bitmap as a Blob; replace the base64 with an object URL */
async function persistImage(c, dataUrl){
  if(!store.available) return; // keep base64 in memory if not connected
  try {
    const blob = b64ToBlob(dataUrl);
    const res = await store.uploadImage(blob, c.id);
    if(res){
      c.img = res.url;       // public CDN URL
      c.imagePath = res.path; // kept so we can delete the file later
    }
  } catch(e){ /* leave base64 in place on failure */ }
}

function openModal(c){
  editing=c;
  const isImage = c?.type==='image';
  modalType = isImage ? 'image' : (c?.type||'note');

  document.getElementById('typeSeg').style.display = isImage ? 'none' : 'flex';
  document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('on', x.dataset.t===modalType));
  // image cards have an optional link; notes don't show URL; link/embed do
  document.getElementById('fUrl').style.display = (isImage || modalType!=='note') ? 'block' : 'none';
  document.querySelector('#fUrl label').textContent = isImage ? 'Link (optional)' : 'URL (link or YouTube)';
  document.getElementById('mTitle').value = c?.title||'';
